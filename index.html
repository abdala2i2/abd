
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>License to Abuse Generator</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 320px;
            flex-shrink: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input[readonly] {
            background: #eeeeee;
            color: #444;
            cursor: not-allowed;
        }

        .download-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .download-btn:hover {
            background: #218838;
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .certificate-container {
            position: relative;
            width: 800px;
            max-width: 100%;
            flex: 1 1 500px;
            overflow: hidden;
        }

        .certificate-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .overlay-text {
            position: absolute;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            color: #1a1a1a;
            font-size: clamp(8px, 1.5vw, 16px);
            overflow-wrap: anywhere;
            line-height: 1.2;
        }

        #text-name {
            top: 43.5%;
            left: 21%;
        }

        #text-no {
            top: 52%;
            left: 21%;
        }

        #text-class {
            top: 60.5%;
            left: 16%;
        }

        #text-issued {
            top: 43.5%;
            left: 72%;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .form-box {
                width: 100%;
            }

            .certificate-container {
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>

    <h2>License to Abuse Customizer</h2>

    <div class="container">

        <!-- Input Form -->
        <div class="form-box">
            <h3>Enter Details</h3>

            <div class="form-group">
                <label for="nameInput">Licensee Name:</label>
                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter name"
                >
            </div>

            <div class="form-group">
                <label for="noInput">License No. (Automatic):</label>
                <input
                    type="text"
                    id="noInput"
                    readonly
                >
            </div>

            <div class="form-group">
                <label for="classInput">Class:</label>
                <input
                    type="text"
                    id="classInput"
                    placeholder="Unfiltered & Unapologetic"
                >
            </div>

            <div class="form-group">
                <label for="issuedInput">Issued Date:</label>
                <input
                    type="text"
                    id="issuedInput"
                    placeholder="DD/MM/YYYY"
                >
            </div>

            <button class="download-btn" id="downloadBtn">
                Download Certificate
            </button>
        </div>

        <!-- Certificate Preview -->
        <div class="certificate-container" id="certificate">

            <img
                src="license.png"
                id="certificateImage"
                alt="License to Abuse Template"
            >

            <div id="text-name" class="overlay-text"></div>
            <div id="text-no" class="overlay-text"></div>
            <div id="text-class" class="overlay-text"></div>
            <div id="text-issued" class="overlay-text"></div>
            <div class="authority-signature">ARajawat</div>


        </div>

    </div>

    <script>
        // Generate today's date in DD/MM/YYYY format
        function getTodayDate() {
            const today = new Date();

            const day = String(today.getDate()).padStart(2, "0");
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const year = today.getFullYear();

            return `${day}/${month}/${year}`;
        }

        // Generate an automatic license number.
        // Example: AB-20261013-4827
        function generateLicenseNumber() {
            const today = new Date();

            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const day = String(today.getDate()).padStart(2, "0");

            const randomNumber = Math.floor(
                1000 + Math.random() * 9000
            );

            return `AB-${year}${month}${day}-${randomNumber}`;
        }

        // Connect an input field to its certificate overlay
        function bindInput(inputId, textId) {
            const input = document.getElementById(inputId);
            const output = document.getElementById(textId);

            function updateText() {
                output.textContent = input.value;
            }

            input.addEventListener("input", updateText);
            updateText();
        }

        // Initialize the form
        document.getElementById("noInput").value =
            generateLicenseNumber();

        document.getElementById("issuedInput").value =
            getTodayDate();

        // Bind form fields to the preview
        bindInput("nameInput", "text-name");
        bindInput("noInput", "text-no");
        bindInput("classInput", "text-class");
        bindInput("issuedInput", "text-issued");

        // Download the certificate as a PNG image
        document.getElementById("downloadBtn").addEventListener(
            "click",
            async function () {
                const certificate =
                    document.getElementById("certificate");

                const button = this;
                const image =
                    document.getElementById("certificateImage");

                try {
                    button.disabled = true;
                    button.textContent = "Generating Certificate...";

                    if (!image.complete || image.naturalWidth === 0) {
                        throw new Error(
                            "Certificate image not found. Check license.png."
                        );
                    }

                    const canvas = await html2canvas(certificate, {
                        scale: 3,
                        useCORS: true,
                        backgroundColor: null
                    });

                    const link = document.createElement("a");

                    link.download =
                        "license-certificate.png";

                    link.href = canvas.toDataURL("image/png");
                    link.click();

                } catch (error) {
                    alert("Unable to download: " + error.message);
                    console.error(error);

                } finally {
                    button.disabled = false;
                    button.textContent = "Download Certificate";
                }
            }
        );
    </script>

</body>
</html>
